name: Check Update Payload Info

on:
  workflow_dispatch:

jobs:
  check_info:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set Up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install gdown and p7zip
        run: |
          pip install gdown
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Download update.zip From Google Drive
        run: |
          mkdir -p workspace
          # Fixed: Removed --id flag to match current gdown syntax
          gdown "16No1NoNDuTk_Ks4HT2SedWgTJFlzGbtl" -O workspace/update.zip

      - name: Extract Update Archive
        run: |
          cd workspace
          7z x update.zip -oupdate_extracted/

      - name: Set Up Payload Dumper Tool
        run: |
          wget https://github.com -O payload_tool.tar.gz
          tar -xzvf payload_tool.tar.gz
          chmod +x payload-dumper-go

      - name: Read and Display Payload Manifest Info
        run: |
          echo "===================================================="
          echo "          ANALYZING PAYLOAD.BIN MANIFEST            "
          echo "===================================================="
          ./payload-dumper-go -l workspace/update_extracted/payload.bin
          
          echo ""
          echo "===================================================="
          echo "          EXTRACTING TARGET OPERATION MAP           "
          echo "===================================================="
          mkdir -p workspace/info_dump
          ./payload-dumper-go -o workspace/info_dump/ workspace/update_extracted/payload.bin
          
          echo "The following patch/image target structures are present inside this update package:"
          ls -lah workspace/info_dump/
          echo "===================================================="
