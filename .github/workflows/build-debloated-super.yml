name: Build and prove debloated super.img
on:
  workflow_dispatch:
    inputs:
      confirm_experimental:
        description: 'Type EXPERIMENTAL to build an unverified firmware image (do NOT flash)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    if: inputs.confirm_experimental == 'EXPERIMENTAL'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space and install tools
        shell: bash
        run: |
          set -euo pipefail
          df -h "$RUNNER_TEMP"
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/share/dotnet /usr/local/share/powershell /usr/local/lib/node_modules || true
          sudo apt-get update -qq
          sudo apt-get install -y android-sdk-libsparse-utils e2fsprogs git
          python3 -m venv "$RUNNER_TEMP/gdown-venv"
          "$RUNNER_TEMP/gdown-venv/bin/pip" install 'gdown==5.2.0'
          git clone --depth 1 https://github.com/Rprop/aosp15_partition_tools.git /tmp/lptools
          for tool in lpdumps lpunpack; do
            sudo install -m755 "/tmp/lptools/linux_glibc_x86_64/$tool" "/usr/local/bin/$tool"
          done
          test -x /usr/bin/img2simg
          if ldd /usr/bin/img2simg | grep -q "not found"; then
            echo "Missing shared library for Ubuntu img2simg" >&2
            exit 1
          fi
          command -v simg2img lpunpack lpdumps debugfs e2fsck
          df -h "$RUNNER_TEMP"
      - name: Download stock image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/firmware"
          "$RUNNER_TEMP/gdown-venv/bin/gdown" --fuzzy 'https://drive.google.com/file/d/1LVuewT3smLf-F-qWvzGm21Rk_z-p6Got/view' -O "$RUNNER_TEMP/firmware/input.img"
      - name: Verify firmware and convert to raw
        shell: bash
        run: |
          set -euo pipefail
          echo '4dbf410905fe93e4e04563c5cc3e97864541af1f7dd2c68ef107830c8236afe1  '"$RUNNER_TEMP/firmware/input.img" | sha256sum -c -
          python3 - <<'PY'
          from pathlib import Path
          p=Path(__import__('os').environ['RUNNER_TEMP'])/'firmware/input.img'
          with p.open('rb') as f:
              magic=f.read(4)
          if magic != bytes.fromhex('3aff26ed'):
              raise SystemExit('Expected sparse super.img. Refusing to continue.')
          PY
          simg2img "$RUNNER_TEMP/firmware/input.img" "$RUNNER_TEMP/firmware/super_raw.img"
          rm -f "$RUNNER_TEMP/firmware/input.img"
          df -h "$RUNNER_TEMP"
      - name: Debloat and rebuild preserving original LP metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 -u scripts/build_debloated_super.py \
            --work "$RUNNER_TEMP/firmware" \
            --manifest config/rmp2106-debloat.json \
            --report "$GITHUB_WORKSPACE/report" \
            --output "$RUNNER_TEMP/firmware/super_debloated_sparse.img"
      - name: Independently validate finished image (same run)
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$RUNNER_TEMP/firmware/super_debloated_sparse.img"
          test -s "$IMAGE"
          file "$IMAGE"
          sha256sum "$IMAGE" | tee "$GITHUB_WORKSPACE/report/output-sha256.txt"
          python3 -u scripts/validate_debloated_super.py \
            --image "$IMAGE" \
            --manifest config/rmp2106-debloat.json \
            --report "$RUNNER_TEMP/phase4"
          cp "$RUNNER_TEMP/phase4/validation-summary.json" "$GITHUB_WORKSPACE/report/validation-summary.json"
          cp "$RUNNER_TEMP/phase4/validated-lp-metadata.txt" "$GITHUB_WORKSPACE/report/validated-lp-metadata.txt"
          cp "$RUNNER_TEMP/phase4/"*-fsck.txt "$GITHUB_WORKSPACE/report/"
          cp "$RUNNER_TEMP/phase4/remaining-apks.csv" "$GITHUB_WORKSPACE/report/"
          cp "$RUNNER_TEMP/phase4/removal-proof.csv" "$GITHUB_WORKSPACE/report/"
          cp "$RUNNER_TEMP/phase4/apk-scan-statistics.json" "$GITHUB_WORKSPACE/report/"
          echo 'OFFLINE VALIDATION ONLY. Android /data is not contained in super.img; installed user-data copies or reinstalls cannot be ruled out. DO NOT FLASH WITHOUT DEVICE REVIEW.' > "$GITHUB_WORKSPACE/report/NOT_FLASH_VERIFIED.txt"
          df -h "$RUNNER_TEMP"
      - name: Upload build logs and sparse image
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RMP2106-debloated-super-with-removal-proof
          path: |
            ${{ runner.temp }}/firmware/super_debloated_sparse.img
            report/
          retention-days: 3
          compression-level: 0
      - name: Upload finished image to Google Drive (optional)
        if: success()
        continue-on-error: true
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
          DRIVE_DESTINATION: ${{ vars.DRIVE_DESTINATION }}
        run: |
          set -euo pipefail
          if [ -z "$RCLONE_CONFIG_B64" ]; then
            echo "Google Drive upload skipped: add repository secret RCLONE_CONFIG_B64 to enable it."
            exit 0
          fi
          if [ -z "$DRIVE_DESTINATION" ]; then
            echo "Google Drive upload skipped: set repository variable DRIVE_DESTINATION (e.g. gdrive:RealmePadMini)."
            exit 0
          fi
          sudo apt-get install -y -qq rclone
          CONFIG_FILE="$RUNNER_TEMP/rclone.conf"
          (umask 077 && printf '%s' "$RCLONE_CONFIG_B64" | base64 -d > "$CONFIG_FILE")
          if ! rclone --config "$CONFIG_FILE" listremotes | grep -q '^[a-zA-Z0-9_-]*:        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RMP2106-debloated-super-with-removal-proof
          path: |
            ${{ runner.temp }}/firmware/super_debloated_sparse.img
            report/
          retention-days: 3
          compression-level: 0
      - name: Upload diagnostic reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RMP2106-build-diagnostics
          path: report/
          if-no-files-found: warn
          retention-days: 7
; then
            echo "No valid rclone remotes configured." >&2
            exit 1
          fi
          IMAGE="$RUNNER_TEMP/firmware/super_debloated_sparse.img"
          OUTPUT_NAME="RMP2106-debloated-super-${GITHUB_RUN_ID}.img"
          rclone --config "$CONFIG_FILE" copyto "$IMAGE" "${DRIVE_DESTINATION%/}/$OUTPUT_NAME" \
            --progress --retries 4 --low-level-retries 10
          LOCAL_SIZE=$(stat -c %s "$IMAGE")
          REMOTE_SIZE=$(rclone --config "$CONFIG_FILE" size "${DRIVE_DESTINATION%/}/$OUTPUT_NAME" --json | python3 -c 'import json,sys;print(json.load(sys.stdin)["bytes"])')
          test "$LOCAL_SIZE" = "$REMOTE_SIZE" || { echo "Google Drive size mismatch" >&2; exit 1; }
          printf 'Uploaded Google Drive file: %s/%s\\n' "${DRIVE_DESTINATION%/}" "$OUTPUT_NAME" | tee "$GITHUB_WORKSPACE/report/google-drive-upload.txt"
          # Never upload or expose the rclone credentials in artifacts or logs.
          rm -f "$CONFIG_FILE"
      - name: Upload diagnostic reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: RMP2106-build-diagnostics
          path: report/
          if-no-files-found: warn
          retention-days: 7
