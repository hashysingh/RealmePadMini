name: Extract existing boot animation from verified super (read-only)
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  extract-bootanimation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Prepare partition tools
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/share/dotnet /usr/local/share/powershell || true
          sudo apt-get update -qq
          sudo apt-get install -y android-sdk-libsparse-utils e2fsprogs git
          git clone --depth 1 https://github.com/Rprop/aosp15_partition_tools.git /tmp/lptools
          sudo install -m755 /tmp/lptools/linux_glibc_x86_64/lpunpack /usr/local/bin/lpunpack
      - name: Download EXACT previously validated super image
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/firmware"
          gh run download 37954304818 --repo "$GITHUB_REPOSITORY" \
            -n RMP2106-debloated-super-with-removal-proof \
            --dir "$RUNNER_TEMP/firmware"
          IMAGE=$(find "$RUNNER_TEMP/firmware" -name super_debloated_sparse.img -type f -print -quit)
          test -n "$IMAGE" && test -s "$IMAGE"
          echo 'd1266658821f587a273e139841f861c7ae1557d3415dde8fc8990aa1e62d74f3  '"$IMAGE" | sha256sum -c -
      - name: Inspect and extract existing animation ZIPs
        shell: bash
        run: |
          set -euo pipefail
          IMAGE=$(find "$RUNNER_TEMP/firmware" -name super_debloated_sparse.img -type f -print -quit)
          python3 -u scripts/extract_bootanimation_from_super.py \
            --image "$IMAGE" \
            --work "$RUNNER_TEMP/animation-inspection" \
            --output "$GITHUB_WORKSPACE/bootanimation-output"
      - name: Upload animation and diagnostic inventory only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RMP2106-extracted-original-bootanimation
          path: bootanimation-output/
          if-no-files-found: warn
          retention-days: 14
