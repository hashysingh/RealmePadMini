name: Check Update Payload Info

on:
  workflow_dispatch:

jobs:
  check_info:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Set Up Python and Tools
        run: |
          pip install gdown requests
          sudo apt-get update
          sudo apt-get install -y p7zip-full

      - name: Download update.zip From Google Drive
        run: |
          mkdir -p workspace
          gdown "16No1NoNDuTk_Ks4HT2SedWgTJFlzGbtl" -O workspace/update.zip

      - name: Extract Update Archive
        run: |
          7z x workspace/update.zip -oworkspace/update_extracted/

      - name: Download Payload Dumper via Python (Safe Link Bypass)
        run: |
          python -c '
          import requests
          url = "https://github.com"
          r = requests.get(url, allow_redirects=True)
          open("workspace/payload_tool.tar.gz", "wb").write(r.content)
          '

      - name: Extract Payload Dumper Tool
        run: |
          cd workspace
          # Unpack without strict gzip boundaries using standard raw extract
          7z x payload_tool.tar.gz
          tar -xf payload_tool.tar
          chmod +x payload-dumper-go

      - name: Show Files Inside Payload
        run: |
          echo "===================================================="
          echo "          LISTING ALL FILES IN UPDATE ZIP           "
          echo "===================================================="
          cd workspace
          ./payload-dumper-go -l update_extracted/payload.bin
          echo "===================================================="
