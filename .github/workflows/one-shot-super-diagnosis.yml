name: One-shot super diagnosis (no Google PAC download)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout diagnostics
        uses: actions/checkout@v4
      - name: "1/4 - Prepare extraction and verification tools"
        shell: bash
        run: |
          set -euo pipefail
          echo "::notice title=No PAC needed::Using previously proven stock AVB root hashes from successful run 38021089885. Google Drive will not be contacted."
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/share/dotnet /usr/local/share/powershell || true
          sudo apt-get update -qq
          sudo apt-get install -y android-sdk-libsparse-utils e2fsprogs git
          git clone --depth 1 https://github.com/Rprop/aosp15_partition_tools.git "$RUNNER_TEMP/lptools"
          sudo install -m755 "$RUNNER_TEMP/lptools/linux_glibc_x86_64/lpunpack" /usr/local/bin/lpunpack
          sudo install -m755 "$RUNNER_TEMP/lptools/linux_glibc_x86_64/lpdumps" /usr/local/bin/lpdumps
          df -h
      - name: "2/4 - Download the exact previously flashed image from GitHub"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/delivered"
          gh run download 37954304818 --repo "$GITHUB_REPOSITORY" -n RMP2106-debloated-super-with-removal-proof --dir "$RUNNER_TEMP/delivered"
          IMAGE=$(find "$RUNNER_TEMP/delivered" -name super_debloated_sparse.img -type f -print -quit)
          test -n "$IMAGE" && test -s "$IMAGE"
          echo "d1266658821f587a273e139841f861c7ae1557d3415dde8fc8990aa1e62d74f3  $IMAGE" | sha256sum -c -
          echo "::notice title=Verified artifact::Using the exact previously delivered image, not rebuilding."
      - name: "3/4 - Perform all image, AVB, app, filesystem and animation checks"
        shell: bash
        run: |
          set -euo pipefail
          IMAGE=$(find "$RUNNER_TEMP/delivered" -name super_debloated_sparse.img -type f -print -quit)
          python3 -u scripts/one_shot_super_diagnosis.py --image "$IMAGE" --work "$RUNNER_TEMP/one-shot-work" --report "$GITHUB_WORKSPACE/one-shot-report"
      - name: "4/4 - Upload consolidated diagnostic report"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RMP2106-one-shot-super-diagnosis
          path: one-shot-report/
          if-no-files-found: warn
          retention-days: 21
      - name: Show consolidated summary
        if: always()
        shell: bash
        run: |
          echo "## One-shot super diagnosis" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**No Google PAC download, flashing, or security-bypass operations.**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if test -f one-shot-report/REPORT.md; then
            cat one-shot-report/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Report was not produced. Inspect the failing step above." >> "$GITHUB_STEP_SUMMARY"
          fi
