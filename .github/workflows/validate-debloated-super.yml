name: Validate built super.img (offline)
on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Successful Build debloated super.img run ID"
        required: true
        default: "37923307117"
        type: string
permissions:
  actions: read
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install offline image tools
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/share/dotnet /usr/local/share/powershell || true
          sudo apt-get update -qq
          sudo apt-get install -y android-sdk-libsparse-utils e2fsprogs git
          git clone --depth 1 https://github.com/Rprop/aosp15_partition_tools.git /tmp/lptools
          for tool in lpdumps lpunpack; do
            sudo install -m755 "/tmp/lptools/linux_glibc_x86_64/$tool" "/usr/local/bin/$tool"
          done
          df -h
      - name: Download existing build artifact
        uses: actions/download-artifact@v4
        with:
          name: RMP2106-experimental-debloated-super
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ github.token }}
          path: downloaded
      - name: Validate resulting image and each debloat target
        shell: bash
        run: |
          set -euo pipefail
          test -s downloaded/super_debloated_sparse.img
          python3 -u scripts/validate_debloated_super.py \
            --image downloaded/super_debloated_sparse.img \
            --manifest config/rmp2106-debloat.json \
            --expected-sha256 4251ce44af642c29a94a493a08245a10ee3e0dc419a77a3591dee3154ba22cd0 \
            --report "$GITHUB_WORKSPACE/validation-report"
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RMP2106-phase4-validation
          path: validation-report/*.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload filesystem check details
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RMP2106-phase4-check-logs
          path: |
            validation-report/*-fsck.txt
            validation-report/validated-lp-metadata.txt
          if-no-files-found: warn
          retention-days: 7
