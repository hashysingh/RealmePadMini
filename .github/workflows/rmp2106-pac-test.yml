name: RMP2106 fresh PAC app removal tests (NO ARTIFACTS)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout exact clean-start scripts
        uses: actions/checkout@v4
      - name: "1/5 - Lint the code and verify 73-item input (no downloads)"
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile restart/test_stock_pac_removal.py restart/test_avb_tree_rebuild.py scripts/inspect_pac_avb.py scripts/build_debloated_super.py
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0,'restart')
          import test_stock_pac_removal as audit
          x=audit.list_targets(Path('restart/removal-list.txt'))
          print(f"Verified {len(x['product_a'])} product + {len(x['system_a'])} system APKs",flush=True)
          PY
          python3 - <<'PY'
          import hashlib,sys,tempfile
          from pathlib import Path
          sys.path.insert(0,"restart")
          sys.path.insert(0,"scripts")
          from test_avb_tree_rebuild import tree
          from audit_debloated_avb_hashtree import merkle_root
          with tempfile.TemporaryDirectory() as folder:
              test=Path(folder)/"synthetic.img"
              test.write_bytes(bytes(range(256))*32)
              salt="01020304"
              d={"Image Size":"8192","Salt":salt,"Hash Algorithm":"sha1",
                 "Data Block Size":"4096","Hash Block Size":"4096"}
              generated,root=tree(test,d)
              independent=merkle_root(test,d)
              assert len(generated)==4096,(len(generated),root)
              assert root==independent,(root,independent)
              assert hashlib.sha256(generated).hexdigest()
              print("PASS: synthetic hashtree bytes and independent SHA1 Merkle root agree",flush=True)
          PY
      - name: "2/5 - Install sparse, ext4, AVB and logical partition tools"
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/share/dotnet /usr/local/share/powershell || true
          sudo apt-get update -qq
          sudo apt-get install -y android-sdk-libsparse-utils e2fsprogs cryptsetup-bin git
          git clone --depth 1 https://github.com/Rprop/aosp15_partition_tools.git "$RUNNER_TEMP/lptools"
          sudo install -m755 "$RUNNER_TEMP/lptools/linux_glibc_x86_64/lpunpack" /usr/local/bin/lpunpack
          git clone --depth 1 https://android.googlesource.com/platform/external/avb "$RUNNER_TEMP/avb"
          command -v simg2img lpunpack debugfs e2fsck veritysetup
          veritysetup --help | grep -F -- "--fec-device" >/dev/null
          veritysetup --help | grep -F -- "--fec-roots" >/dev/null
          echo "::notice title=FEC support verified::veritysetup exposes forward error correction arguments."
          python3 "$RUNNER_TEMP/avb/avbtool.py" version
          python3 -m venv "$RUNNER_TEMP/download-venv"
          "$RUNNER_TEMP/download-venv/bin/pip" install 'gdown==5.2.0'
          df -h "$RUNNER_TEMP"
      - name: "3/5 - Download ORIGINAL full PAC once (hash is checked before extraction)"
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/download-venv/bin/gdown" --fuzzy \
            'https://drive.google.com/file/d/1wDNZu-Nrk28suL5qPC3TxA_CcKX8WExd/view' \
            -O "$RUNNER_TEMP/RMP2106PU_11.A.21-original.pac"
          echo '381c295640947371b604ab830da04dc6d90be4b3c99b9c9c409c73dd51320c0b  '"$RUNNER_TEMP/RMP2106PU_11.A.21-original.pac" | sha256sum -c -
      - name: "4/5 - Inspect all vbmeta, remove 73 APKs, rebuild scratch AVB hashtrees and FEC"
        shell: bash
        run: |
          set -euo pipefail
          python3 -u restart/test_stock_pac_removal.py \
            --pac "$RUNNER_TEMP/RMP2106PU_11.A.21-original.pac" \
            --targets "$GITHUB_WORKSPACE/restart/removal-list.txt" \
            --work "$RUNNER_TEMP/scratch-firmware" \
            --avbtool "$RUNNER_TEMP/avb/avbtool.py"
      - name: "5/5 - Explicitly forbid firmware artifact publishing in test phase"
        if: always()
        shell: bash
        run: |
          echo "## Fresh PAC removal validation" >> "$GITHUB_STEP_SUMMARY"
          echo "Only step logs are retained; **NO upload-artifact step and NO firmware output**." >> "$GITHUB_STEP_SUMMARY"
          echo "All binaries and private working images are disposable runner files." >> "$GITHUB_STEP_SUMMARY"
          echo "Nothing in this workflow is installable or boot-verified; OEM AVB signatures remain invalid even if FEC generation passes." >> "$GITHUB_STEP_SUMMARY"
