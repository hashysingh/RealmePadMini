name: Audit delivered debloated image against stock dm-verity (read-only)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - name: Prepare utilities and storage
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/share/dotnet /usr/local/share/powershell || true
          sudo apt-get update -qq
          sudo apt-get install -y android-sdk-libsparse-utils git
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install 'gdown==5.2.0'
          git clone --depth 1 https://android.googlesource.com/platform/external/avb "$RUNNER_TEMP/avb"
          git clone --depth 1 https://github.com/Rprop/aosp15_partition_tools.git "$RUNNER_TEMP/lptools"
          sudo install -m755 "$RUNNER_TEMP/lptools/linux_glibc_x86_64/lpunpack" /usr/local/bin/lpunpack
          df -h
      - name: Download original PAC with pinned hash
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/venv/bin/gdown" --fuzzy 'https://drive.google.com/file/d/1vFwAIxA8AbWz9iqzMtMBZFHWma2GMJfJ/view' -O "$RUNNER_TEMP/original.pac"
          echo "381c295640947371b604ab830da04dc6d90be4b3c99b9c9c409c73dd51320c0b  $RUNNER_TEMP/original.pac" | sha256sum -c -
      - name: Download exact previously delivered modified super
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/delivered"
          gh run download 37954304818 --repo "$GITHUB_REPOSITORY" -n RMP2106-debloated-super-with-removal-proof --dir "$RUNNER_TEMP/delivered"
          IMAGE=$(find "$RUNNER_TEMP/delivered" -name super_debloated_sparse.img -type f -print -quit)
          test -n "$IMAGE" && test -s "$IMAGE"
          echo "d1266658821f587a273e139841f861c7ae1557d3415dde8fc8990aa1e62d74f3  $IMAGE" | sha256sum -c -
      - name: Compute and compare signed stock and modified dm-verity roots
        shell: bash
        run: |
          set -euo pipefail
          IMAGE=$(find "$RUNNER_TEMP/delivered" -name super_debloated_sparse.img -type f -print -quit)
          python3 -u scripts/audit_debloated_avb_hashtree.py --pac "$RUNNER_TEMP/original.pac" --modified "$IMAGE" --avbtool "$RUNNER_TEMP/avb/avbtool.py" --work "$RUNNER_TEMP/verity-work" --report "$GITHUB_WORKSPACE/verity-report"
      - name: Upload only text and JSON verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RMP2106-debloated-dm-verity-comparison
          path: verity-report/
          if-no-files-found: warn
          retention-days: 14
