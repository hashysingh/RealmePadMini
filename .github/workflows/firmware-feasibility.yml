name: Firmware AVB FEC feasibility review (one run, no Google)
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: "1/5 - Prepare unpacking tools"
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/share/dotnet /usr/local/share/powershell || true
          sudo apt-get update -qq
          sudo apt-get install -y android-sdk-libsparse-utils e2fsprogs git
          git clone --depth 1 https://github.com/Rprop/aosp15_partition_tools.git "$RUNNER_TEMP/lptools"
          sudo install -m755 "$RUNNER_TEMP/lptools/linux_glibc_x86_64/lpunpack" /usr/local/bin/lpunpack
          sudo install -m755 "$RUNNER_TEMP/lptools/linux_glibc_x86_64/lpdumps" /usr/local/bin/lpdumps
          echo "::notice title=No Google Drive::This review uses only previously verified GitHub artifacts."
      - name: "2/5 - Download existing debloated firmware once from GitHub"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/inputs/modified"
          gh run download 37954304818 --repo "$GITHUB_REPOSITORY" -n RMP2106-debloated-super-with-removal-proof --dir "$RUNNER_TEMP/inputs/modified"
          IMAGE=$(find "$RUNNER_TEMP/inputs/modified" -name super_debloated_sparse.img -type f -print -quit)
          test -s "$IMAGE"
          echo "d1266658821f587a273e139841f861c7ae1557d3415dde8fc8990aa1e62d74f3  $IMAGE" | sha256sum -c -
      - name: "3/5 - Download tiny original AVB descriptor report"
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/inputs/avb"
          gh run download 38021089885 --repo "$GITHUB_REPOSITORY" -n RMP2106-debloated-dm-verity-comparison --dir "$RUNNER_TEMP/inputs/avb"
          test -s "$RUNNER_TEMP/inputs/avb/system-avb-descriptor.txt"
          test -s "$RUNNER_TEMP/inputs/avb/product-avb-descriptor.txt"
      - name: "4/5 - Inspect original AVB geometry, ext4 layout and security blockers"
        shell: bash
        run: |
          set -euo pipefail
          IMAGE=$(find "$RUNNER_TEMP/inputs/modified" -name super_debloated_sparse.img -type f -print -quit)
          python3 -u scripts/review_avb_fec_feasibility.py --image "$IMAGE" --stock-descriptors "$RUNNER_TEMP/inputs/avb" --work "$RUNNER_TEMP/work" --report "$GITHUB_WORKSPACE/feasibility-report"
      - name: "5/5 - Upload findings"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RMP2106-firmware-feasibility-report
          path: feasibility-report/
          if-no-files-found: warn
          retention-days: 21
      - name: Show report
        if: always()
        shell: bash
        run: |
          echo "## Firmware AVB/FEC feasibility review" >> "$GITHUB_STEP_SUMMARY"
          if test -f feasibility-report/REPORT.md; then
            cat feasibility-report/REPORT.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No report generated; inspect the first failed step." >> "$GITHUB_STEP_SUMMARY"
          fi
