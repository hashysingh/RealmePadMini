name: Diagnose flashed super image against stock (read-only)
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Prepare tools and disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/share/dotnet /usr/local/share/powershell || true
          sudo apt-get update -qq
          sudo apt-get install -y android-sdk-libsparse-utils e2fsprogs git
          python3 -m venv "$RUNNER_TEMP/gdown-venv"
          "$RUNNER_TEMP/gdown-venv/bin/pip" install 'gdown==5.2.0'
          git clone --depth 1 https://github.com/Rprop/aosp15_partition_tools.git /tmp/lptools
          sudo install -m755 /tmp/lptools/linux_glibc_x86_64/lpunpack /usr/local/bin/lpunpack
          sudo install -m755 /tmp/lptools/linux_glibc_x86_64/lpdumps /usr/local/bin/lpdumps
          df -h "$RUNNER_TEMP"
      - name: Download replacement reference super image
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/diagnostic"
          "$RUNNER_TEMP/gdown-venv/bin/gdown" --fuzzy \
            'https://drive.google.com/file/d/14In5VC3vjPqpKfQ2cGnFWoOXZTK_Z1UK/view' \
            -O "$RUNNER_TEMP/diagnostic/stock-super.img"
          sha256sum "$RUNNER_TEMP/diagnostic/stock-super.img"
          echo 'Reference image hash is not pinned: confirm this is the original stock image before trusting comparisons.'
      - name: Download exact existing delivered image (no rebuild)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download 37954304818 --repo "$GITHUB_REPOSITORY" \
            -n RMP2106-debloated-super-with-removal-proof \
            --dir "$RUNNER_TEMP/diagnostic/delivered"
          IMAGE=$(find "$RUNNER_TEMP/diagnostic/delivered" -name super_debloated_sparse.img -type f -print -quit)
          test -n "$IMAGE" && test -s "$IMAGE"
          echo 'd1266658821f587a273e139841f861c7ae1557d3415dde8fc8990aa1e62d74f3  '"$IMAGE" | sha256sum -c -
      - name: Independently compare partition bytes and target paths
        shell: bash
        run: |
          set -euo pipefail
          IMAGE=$(find "$RUNNER_TEMP/diagnostic/delivered" -name super_debloated_sparse.img -type f -print -quit)
          python3 -u scripts/audit_super_partition_blocks.py \
            --stock "$RUNNER_TEMP/diagnostic/stock-super.img" \
            --debloated "$IMAGE" \
            --work "$RUNNER_TEMP/diagnostic/audit-work" \
            --report "$GITHUB_WORKSPACE/diagnostic-report"
      - name: Upload small diagnostic reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RMP2106-super-partition-block-diagnostics
          path: diagnostic-report/
          if-no-files-found: warn
          retention-days: 7
