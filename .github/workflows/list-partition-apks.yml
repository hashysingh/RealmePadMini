name: List all partition APKs A-Z (TXT)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  list-apks:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y android-sdk-libsparse-utils e2fsprogs git
          python3 -m venv "$RUNNER_TEMP/gdown-venv"
          "$RUNNER_TEMP/gdown-venv/bin/pip" install 'gdown==5.2.0'
          git clone --depth 1 https://github.com/Rprop/aosp15_partition_tools.git /tmp/lptools
          sudo install -m755 /tmp/lptools/linux_glibc_x86_64/lpunpack /usr/local/bin/lpunpack
          command -v simg2img lpunpack debugfs
      - name: Download supplied super.img
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/firmware"
          "$RUNNER_TEMP/gdown-venv/bin/gdown" --fuzzy \
            'https://drive.google.com/file/d/14In5VC3vjPqpKfQ2cGnFWoOXZTK_Z1UK/view' \
            -O "$RUNNER_TEMP/firmware/super.img"
      - name: Identify image format and extract logical partitions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_partitions.py \
            "$RUNNER_TEMP/firmware/super.img" \
            "$RUNNER_TEMP/firmware" \
            ""
      - name: Scan every EXT partition for APK files
        shell: bash
        run: |
          set -euo pipefail
          python3 -u scripts/scan_all_apks.py \
            --partitions "$RUNNER_TEMP/firmware/partitions" \
            --report "$GITHUB_WORKSPACE/apk-list-report"
      - name: Create alphabetical TXT files
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/format_apk_inventory.py --report "$GITHUB_WORKSPACE/apk-list-report"
      - name: Upload APK inventory TXT files (no firmware images)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: RMP2106-all-partition-apks-A-to-Z
          path: apk-list-report/
          if-no-files-found: warn
          retention-days: 7
